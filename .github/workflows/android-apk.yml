name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-app-foundation
    paths:
      - "index.html"
      - "app.js"
      - "ui.js"
      - "expiry-entry.js"
      - "inventory-fields.js"
      - "activity-report.js"
      - "runtime-services.js"
      - "enhancements.js"
      - "android-native/**"
      - "sw.js"
      - "styles.css"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Prepare bundled app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync native plugins
        run: npx cap sync android
      - name: Add native notification settings bridge
        run: |
          mkdir -p android/app/src/main/java/com/redro/spoilfreecopy
          cp android-native/NotificationSettingsPlugin.java android/app/src/main/java/com/redro/spoilfreecopy/NotificationSettingsPlugin.java
          cp android-native/MainActivity.java android/app/src/main/java/com/redro/spoilfreecopy/MainActivity.java
      - name: Set Android 7 minimum API
        run: |
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/' android/variables.gradle
          grep -q 'minSdkVersion = 24' android/variables.gradle
      - name: Generate Redro launcher icons
        run: |
          cat > /tmp/GenerateIcons.java <<'EOF'
          import java.awt.*;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          public class GenerateIcons {
            static BufferedImage render(BufferedImage src, int size, boolean inset) {
              BufferedImage out = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB);
              Graphics2D g = out.createGraphics();
              g.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC);
              g.setColor(Color.WHITE);
              g.fillRect(0, 0, size, size);
              int target = inset ? (int)(size * 0.72) : size;
              g.drawImage(src, (size-target)/2, (size-target)/2, target, target, null);
              g.dispose();
              return out;
            }
            public static void main(String[] args) throws Exception {
              BufferedImage src = ImageIO.read(new File("assets/brand-icon.png"));
              if (src == null) throw new IllegalStateException("Missing Redro brand icon");
              String[] dirs = {"mipmap-mdpi","mipmap-hdpi","mipmap-xhdpi","mipmap-xxhdpi","mipmap-xxxhdpi"};
              int[] sizes = {48,72,96,144,192};
              for (int i=0;i<dirs.length;i++) {
                File dir = new File("android/app/src/main/res/"+dirs[i]);
                dir.mkdirs();
                ImageIO.write(render(src,sizes[i],false),"png",new File(dir,"ic_launcher.png"));
                ImageIO.write(render(src,sizes[i],true),"png",new File(dir,"ic_launcher_round.png"));
                ImageIO.write(render(src,sizes[i],true),"png",new File(dir,"ic_launcher_foreground.png"));
              }
            }
          }
          EOF
          javac /tmp/GenerateIcons.java
          java -Djava.awt.headless=true -cp /tmp GenerateIcons
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/white"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redro-food-stock-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
